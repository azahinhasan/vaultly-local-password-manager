plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vaultlyautofill'
version = '0.1.0'

android {
  namespace "expo.modules.vaultlyautofill"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ReactActivity / DefaultReactActivityDelegate for the unlock activity.
  compileOnly 'com.facebook.react:react-android'
}
